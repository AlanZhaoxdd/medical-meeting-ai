name: medical-meeting-ai

services:
  bge-models:
    build:
      args:
        # CUDA wheel index for the model-service image. Replaces the CPU torch
        # pinned in uv.lock (SJTU domestic mirror of download.pytorch.org).
        # Override per host driver, for example:
        #   TORCH_INDEX_URL=https://mirror.sjtu.edu.cn/pytorch-wheels/cu128
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://mirror.sjtu.edu.cn/pytorch-wheels/cu126}
    environment:
      BGE_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
