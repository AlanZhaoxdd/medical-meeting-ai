[project]
name = "medical-kb-model-service"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.140.0",
  "FlagEmbedding==1.3.5",
  "pydantic-settings==2.14.2",
  "torch==2.13.0",
  "transformers>=4.44,<5",
  "uvicorn[standard]==0.51.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.uv]
package = false
